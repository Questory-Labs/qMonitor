name: canary

on:
  push:
    branches: [main]

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.meta.outputs.build_number }}
      canary_version: ${{ steps.meta.outputs.canary_version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          BASE="$(node -p "require('./package.json').version")"
          VERSION="${BASE}-canary.${BUILD_NUMBER}"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "canary_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.meta.outputs.canary_version }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "*-bundles"
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Retire leftover rolling canary tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One-shot cleanup of the old reused `canary` tag. Unique v*-canary.*
          # prereleases are never deleted.
          if gh release view canary >/dev/null 2>&1; then
            gh release delete canary --yes --cleanup-tag
            echo "Removed leftover rolling tag canary"
          fi

      - name: Publish canary prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: qMonitor canary (${{ needs.meta.outputs.build_number }})
          body: |
            Canary prerelease from `main`.

            - Build: `${{ needs.meta.outputs.build_number }}`
            - Commit: `${{ github.sha }}`
            - Version: `${{ needs.meta.outputs.canary_version }}`
            - Tag: `${{ needs.meta.outputs.tag }}`
          prerelease: true
          make_latest: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
